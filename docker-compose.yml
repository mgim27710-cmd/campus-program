# [4단계] 컨테이너 4개를 한 번에 실행
#   브라우저 → nginx(:80) → app(Spring Boot :8080) → mysql, redis
# 실행: docker compose up -d --build

services:

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    # 포트를 밖으로 열지 않음 → app 컨테이너만 내부 네트워크로 접속
    # (내 컴퓨터에서 쓰는 다른 MySQL과 3306 포트가 겹치지 않음)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # appendonly: Redis를 재시작해도 데이터가 남도록 파일에 기록
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    # 포트를 밖으로 열지 않음 → app 컨테이너만 내부 네트워크로 접속
    # (내 컴퓨터에서 쓰는 다른 Redis와 6379 포트가 겹치지 않음)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 작은 EC2(메모리 1~2GB)에서도 버티도록 자바 메모리 상한 지정
      JAVA_TOOL_OPTIONS: -Xmx384m
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
